[project]
name = "the-road-to-expressive"
version = "0.1.0"
description = "Curated local corpus, bytecode API parity tracker, and SQLite FTS5 query CLI for Material 3 Expressive, Compose Multiplatform, cross-platform HIG, and UX writing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rtx = "rtx.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
